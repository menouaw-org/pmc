[project]
name = "pmc"
version = "0.1.0"
description = "pmc pour de la classification d'images"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio",
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
    "pyyaml",
    "seaborn",
    "tqdm",
    "wandb",
]

[dependency-groups]
dev = [
    "jupyter",
    "pyright",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]